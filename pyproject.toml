[project]
name = "agent-svc"
version = "0.1.0"
description = "Composable agent-as-a-microservice template (FastAPI, async, SOLID)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "redis>=5.0",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "tenacity>=9.0",
  "prometheus-client>=0.20",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
litellm = [
    "litellm>=1.50",
]
langgraph = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
]
langfuse = [
    "langfuse>=3.0",
]
mlflow = [
    "mlflow-tracing>=3.0",
]

# Optional extras (litellm, langgraph, adk, deepagents, maf, crewai, mlflow, langfuse, ...)
# are added in the phase that implements each adapter, with uv conflict declarations.

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "fakeredis[lua]>=2.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "mkdocs-material>=9.5",
  "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_svc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: needs docker services"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["agent_svc.domain.models.Usage"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["agent_svc.adapters.llm.litellm_client"]
implicit_reexport = true
