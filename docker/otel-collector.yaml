receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
      grpc: {endpoint: 0.0.0.0:4317}
processors:
  batch: {}
  memory_limiter: {check_interval: 1s, limit_mib: 256}
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  debug: {verbosity: basic}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
    # Metrics only reach the debug log here. Add your backend (Prometheus remote write, Mimir,
    # Datadog, ...) as an exporter below to keep them.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
