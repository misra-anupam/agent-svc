# Always on: api, redis, postgres, otel-collector + jaeger (traces, UI :16686), mlflow (prompts + evals, UI :5001).
# Optional profiles: mcp-demo   (docker compose --profile <name> up)
name: agent-svc
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: ${AGENT_EXTRAS:---extra litellm --extra langgraph --extra otel --extra mlflow --extra mlflow_genai}
    env_file: [../env/local-min.env]
    environment:
      AGENT_REDIS__URL: redis://redis:6379/0
      AGENT_POSTGRES__DSN: postgresql://agent:agent@postgres:5432/agent
      AGENT_TRACING__OTLP_ENDPOINT: http://otel-collector:4318
      AGENT_PROMPTS__MLFLOW_TRACKING_URI: http://mlflow:5000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # MCP: see the mcp-demo profile for a ready-made server (needs `--extra mcp` in AGENT_EXTRAS)
      AGENT_MCP__SERVERS: ${AGENT_MCP__SERVERS:-[]}
      AGENT_MCP__ALLOWED_HOSTS: ${AGENT_MCP__ALLOWED_HOSTS:-[]}
      AGENT_TOOLS__LOCAL: ${AGENT_TOOLS__LOCAL:-["calculator","current_time"]}
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      mlflow: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    volumes: [redis-data:/data]

  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agent"], interval: 5s, timeout: 3s, retries: 10}
    volumes: [pg-data:/var/lib/postgresql/data]

  # ---- OpenTelemetry: collector (OTLP :4318) -> Jaeger UI on :16686 --------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: [./otel-collector.yaml:/etc/otel/config.yaml:ro]
    ports: ["4318:4318"]  # for an API running on the host
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]

  # ---- mlflow: prompt registry and eval runs (UI on :5001) ---------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
      --default-artifact-root mlflow-artifacts:/
    volumes: [mlflow-data:/mlflow]
    ports: ["5001:5000"]  # 5000 is taken by AirPlay on macOS

  # ---- profile: mcp-demo (MCP server on :8080 with add/boom/big tools) --------------------
  # AGENT_EXTRAS="--extra litellm --extra langgraph --extra mcp" \
  # AGENT_MCP__SERVERS='[{"name":"demo","transport":"streamable_http","url":"http://mcp-demo:8080/mcp"}]' \
  # AGENT_MCP__ALLOWED_HOSTS='["mcp-demo"]' docker compose --profile mcp-demo up --build
  mcp-demo:
    profiles: [mcp-demo]
    image: python:3.12-slim
    command: ["sh", "-c", "pip install --no-cache-dir 'mcp>=2.3' && python /srv/mcp_server.py streamable-http 8080"]
    volumes: [../tests/fixtures/mcp_server.py:/srv/mcp_server.py:ro]
    expose: ["8080"]

volumes:
  redis-data:
  pg-data:
  mlflow-data:
