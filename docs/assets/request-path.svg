<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" role="img" aria-label="Request path: HTTP, auth, admission, tracing, cache and guardrail decorators, orchestrator with LLM and tool stacks, SSE events"><style>
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;fill:#1f2937}
.t{font-weight:600}.s{font-size:12.5px;fill:#4b5563}.n{font-size:13px;fill:#8b95a1}
.box{fill:#eef2f7;stroke:#94a3b8;stroke-width:1.5}
.dec{fill:#e8f0fe;stroke:#6b8afd;stroke-width:1.5}
.grp{fill:none;stroke:#6b8afd;stroke-width:1.5;stroke-dasharray:6 5}
.orc{fill:#fff4e5;stroke:#f59e0b;stroke-width:1.5}
.out{fill:#e7f6ec;stroke:#34a853;stroke-width:1.5}
.ad{fill:#f3e8fd;stroke:#a855f7;stroke-width:1.5}
.ln{stroke:#8b95a1;stroke-width:1.8;fill:none;marker-end:url(#a)}
.ld{stroke:#8b95a1;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b95a1"/></marker></defs>
<rect class="box" x="40" y="20" width="360" height="44" rx="9"/><text class="t" x="220.0" y="46.0" text-anchor="middle">HTTP request</text>
<rect class="box" x="40" y="84" width="360" height="44" rx="9"/><text class="t" x="220.0" y="110.0" text-anchor="middle">Auth (JWT, switchable)</text>
<rect class="box" x="40" y="148" width="360" height="60" rx="9"/><text class="t" x="220.0" y="173.0" text-anchor="middle">AdmissionService</text><text class="s" x="220.0" y="191.0" text-anchor="middle">rate limit  &gt;  token budget  &gt;  concurrency lease</text>
<rect class="grp" x="28" y="228" width="384" height="226" rx="12"/><text class="n" x="236" y="246">runner decorators (outermost first)</text>
<rect class="dec" x="40" y="256" width="360" height="44" rx="9"/><text class="t" x="220.0" y="282.0" text-anchor="middle">TracedRunner</text>
<rect class="dec" x="40" y="320" width="360" height="44" rx="9"/><text class="t" x="220.0" y="346.0" text-anchor="middle">CachedRunner</text>
<rect class="dec" x="40" y="384" width="360" height="56" rx="9"/><text class="t" x="220.0" y="407.0" text-anchor="middle">GuardedRunner</text><text class="s" x="220.0" y="425.0" text-anchor="middle">input check  &gt;  run  &gt;  output check</text>
<rect class="orc" x="40" y="478" width="360" height="60" rx="9"/><text class="t" x="220.0" y="503.0" text-anchor="middle">Orchestrator</text><text class="s" x="220.0" y="521.0" text-anchor="middle">LangGraph | echo</text>
<rect class="out" x="40" y="592" width="360" height="60" rx="9"/><text class="t" x="220.0" y="617.0" text-anchor="middle">SSE event stream</text><text class="s" x="220.0" y="635.0" text-anchor="middle">run.started ... run.completed | run.error</text>
<path class="ln" d="M220 64V84"/>
<path class="ln" d="M220 128V148"/>
<path class="ln" d="M220 208V256"/>
<path class="ln" d="M220 300V320"/>
<path class="ln" d="M220 364V384"/>
<path class="ln" d="M220 440V478"/>
<path class="ln" d="M220 538V592"/>
<text class="n" x="420" y="628">events stream back out through each wrapper</text>
<rect class="box" x="480" y="436" width="360" height="76" rx="9"/><text class="t" x="660.0" y="460.0" text-anchor="middle">LLM stack</text><text class="s" x="660.0" y="478.0" text-anchor="middle">Metered ( Fallback ( Breaker ( Retry ( LiteLLM ))))</text><text class="s" x="660.0" y="496.0" text-anchor="middle">primary and secondary model</text>
<rect class="box" x="480" y="534" width="360" height="76" rx="9"/><text class="t" x="660.0" y="558.0" text-anchor="middle">Tool stack</text><text class="s" x="660.0" y="576.0" text-anchor="middle">Guarded ( Composite ( local tools, MCP servers ))</text><text class="s" x="660.0" y="594.0" text-anchor="middle">allowlist, schema check, timeout, size cap</text>
<path class="ln" d="M400 498H440V474H480"/><path class="ln" d="M400 518H440V572H480"/>
<text class="n" x="420" y="110">401 before the stream starts</text>
<text class="n" x="420" y="172">429 / 503 + Retry-After before the stream</text>
<text class="n" x="420" y="282">spans for every step; traces cache hits too</text>
<text class="n" x="420" y="346">exact match; optional semantic match</text>
<text class="n" x="420" y="412">block: run.error policy_violation</text>
</svg>